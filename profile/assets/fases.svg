<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Fases de uma operacao: descida, aproximacao, conexao, intertravamento e recolhimento">
  <title>Fases de uma operacao simulada</title>
  <defs>
    <linearGradient id="trilho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d5f7f" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#2a7fa6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1d5f7f" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fe3ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7fe3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="120" fill="#061522"/>
  <line x1="110" y1="52" x2="1090" y2="52" stroke="url(#trilho)" stroke-width="2"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#8fb6cc" text-anchor="middle">
    <g>
      <circle cx="110" cy="52" r="9" fill="#0b2b3d" stroke="#2a7fa6" stroke-width="2"/>
      <circle cx="110" cy="52" r="4" fill="#7fe3ff"><animate attributeName="opacity" values="1;0.15;0.15;0.15;0.15;1" dur="10s" repeatCount="indefinite"/></circle>
      <text x="110" y="86">Descida</text>
    </g>
    <g>
      <circle cx="355" cy="52" r="9" fill="#0b2b3d" stroke="#2a7fa6" stroke-width="2"/>
      <circle cx="355" cy="52" r="4" fill="#7fe3ff"><animate attributeName="opacity" values="0.15;1;0.15;0.15;0.15;0.15" dur="10s" repeatCount="indefinite"/></circle>
      <text x="355" y="86">Aproximação</text>
    </g>
    <g>
      <circle cx="600" cy="52" r="9" fill="#0b2b3d" stroke="#2a7fa6" stroke-width="2"/>
      <circle cx="600" cy="52" r="4" fill="#7fe3ff"><animate attributeName="opacity" values="0.15;0.15;1;0.15;0.15;0.15" dur="10s" repeatCount="indefinite"/></circle>
      <text x="600" y="86">Conexão</text>
    </g>
    <g>
      <circle cx="845" cy="52" r="9" fill="#0b2b3d" stroke="#2a7fa6" stroke-width="2"/>
      <circle cx="845" cy="52" r="4" fill="#2bd7a0"><animate attributeName="opacity" values="0.15;0.15;0.15;1;0.15;0.15" dur="10s" repeatCount="indefinite"/></circle>
      <text x="845" y="86">Intertravamento</text>
    </g>
    <g>
      <circle cx="1090" cy="52" r="9" fill="#0b2b3d" stroke="#2a7fa6" stroke-width="2"/>
      <circle cx="1090" cy="52" r="4" fill="#7fe3ff"><animate attributeName="opacity" values="0.15;0.15;0.15;0.15;1;0.15" dur="10s" repeatCount="indefinite"/></circle>
      <text x="1090" y="86">Recolhimento</text>
    </g>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 980 0" dur="10s" repeatCount="indefinite"/>
    <circle cx="110" cy="52" r="20" fill="url(#halo)"/>
    <rect x="98" y="43" width="24" height="14" rx="3" fill="#113853" stroke="#7fe3ff" stroke-width="1.4"/>
    <rect x="96" y="39" width="28" height="4" rx="2" fill="#2a7fa6"/>
    <circle cx="116" cy="50" r="2.2" fill="#eaf8ff"/>
  </g>
</svg>
