<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="ROV descendo por um tether ate um manifold no leito marinho">
  <title>Simulacao ROV - BlueVecHub</title>
  <defs>
    <linearGradient id="agua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b3350"/>
      <stop offset="45%" stop-color="#071d31"/>
      <stop offset="100%" stop-color="#02080f"/>
    </linearGradient>
    <linearGradient id="raio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd4ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7fd4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="farol" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cbefff" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#cbefff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leito" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e3047"/>
      <stop offset="100%" stop-color="#05121c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#agua)"/>

  <g>
    <polygon points="140,-40 226,-40 352,340 236,340" fill="url(#raio)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="7s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="430,-40 486,-40 580,340 500,340" fill="url(#raio)">
      <animate attributeName="opacity" values="0.9;0.35;0.9" dur="9s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="930,-40 1010,-40 1126,340 1016,340" fill="url(#raio)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="11s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <g fill="#bfe4f7">
    <circle cx="180" cy="300" r="1.6" opacity="0.5"><animate attributeName="cy" values="320;-10" dur="17s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="280" r="1.1" opacity="0.4"><animate attributeName="cy" values="330;-10" dur="23s" repeatCount="indefinite"/></circle>
    <circle cx="455" cy="200" r="1.8" opacity="0.35"><animate attributeName="cy" values="340;-10" dur="19s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="260" r="1.2" opacity="0.5"><animate attributeName="cy" values="340;-10" dur="26s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="180" r="1.5" opacity="0.4"><animate attributeName="cy" values="330;-10" dur="21s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="240" r="1.1" opacity="0.45"><animate attributeName="cy" values="340;-10" dur="15s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="300" r="1.7" opacity="0.3"><animate attributeName="cy" values="340;-10" dur="29s" repeatCount="indefinite"/></circle>
  </g>

  <path d="M0 302 C 150 288, 300 312, 460 300 C 640 286, 820 310, 1000 298 C 1100 292, 1160 300, 1200 296 L1200 340 L0 340 Z" fill="url(#leito)"/>

  <g transform="translate(760 0)">
    <g>
      <rect x="-52" y="268" width="104" height="30" rx="4" fill="#0c3146" stroke="#1d5f7f" stroke-width="1.5"/>
      <rect x="-40" y="256" width="18" height="14" rx="2" fill="#10415c" stroke="#1d5f7f" stroke-width="1.2"/>
      <rect x="22" y="256" width="18" height="14" rx="2" fill="#10415c" stroke="#1d5f7f" stroke-width="1.2"/>
      <path d="M-30 268 L-30 246 M30 268 L30 246" stroke="#1d5f7f" stroke-width="2" fill="none"/>
      <circle cx="-8" cy="283" r="3" fill="#2bd7a0"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="10" cy="283" r="3" fill="#e8b04b"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.1s" repeatCount="indefinite"/></circle>
    </g>

    <path d="M0 -10 C 6 60, -8 110, 0 150" stroke="#5f93ad" stroke-width="2.4" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M0 -10 C 6 60, -8 110, 0 150; M0 -10 C -7 60, 9 112, 0 156; M0 -10 C 6 60, -8 110, 0 150" dur="8s" repeatCount="indefinite"/>
    </path>

    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 7; 0 0" dur="8s" repeatCount="indefinite"/>

      <polygon points="-26,186 26,186 92,286 -92,286" fill="url(#farol)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="4.5s" repeatCount="indefinite"/>
      </polygon>

      <circle cx="0" cy="168" r="18" fill="none" stroke="#7fe3ff" stroke-width="1.6" opacity="0">
        <animate attributeName="r" values="18;120" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0" dur="4s" repeatCount="indefinite"/>
      </circle>

      <rect x="-56" y="142" width="112" height="9" rx="4.5" fill="#15425c" stroke="#2a7fa6" stroke-width="1.2"/>
      <rect x="-48" y="151" width="96" height="40" rx="7" fill="#113853" stroke="#2a7fa6" stroke-width="1.6"/>
      <rect x="-40" y="159" width="34" height="16" rx="3" fill="#0a2738" stroke="#2a7fa6" stroke-width="1"/>
      <circle cx="18" cy="167" r="9" fill="#0a2738" stroke="#2a7fa6" stroke-width="1.3"/>
      <circle cx="18" cy="167" r="3.4" fill="#7fe3ff"><animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/></circle>

      <g stroke="#2a7fa6" stroke-width="1.4" fill="#0d3047">
        <circle cx="-56" cy="172" r="10"/>
        <circle cx="56" cy="172" r="10"/>
      </g>
      <g stroke="#7fe3ff" stroke-width="1.6" fill="none" opacity="0.85">
        <path d="M-62 172 L-50 172 M-56 166 L-56 178">
          <animateTransform attributeName="transform" type="rotate" from="0 -56 172" to="360 -56 172" dur="1.3s" repeatCount="indefinite"/>
        </path>
        <path d="M50 172 L62 172 M56 166 L56 178">
          <animateTransform attributeName="transform" type="rotate" from="360 56 172" to="0 56 172" dur="1.6s" repeatCount="indefinite"/>
        </path>
      </g>

      <path d="M-34 191 L-44 206 L-30 214" stroke="#2a7fa6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <animateTransform attributeName="transform" type="rotate" values="-6 -34 191; 8 -34 191; -6 -34 191" dur="6s" repeatCount="indefinite"/>
      </path>

      <circle cx="-26" cy="188" r="4" fill="#eaf8ff"/>
      <circle cx="26" cy="188" r="4" fill="#eaf8ff"/>
    </g>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="70" y="150" fill="#eaf6ff" font-size="44" font-weight="700" letter-spacing="1.5">Simulação ROV</text>
    <text x="70" y="186" fill="#6fb6d8" font-size="19" font-weight="600" letter-spacing="3.6">BLUEVECHUB</text>
    <rect x="70" y="204" width="54" height="3" rx="1.5" fill="#2a7fa6"/>
    <text x="70" y="236" fill="#8fb6cc" font-size="15">Operações ROV e subsea simuladas antes do mar</text>
  </g>
</svg>
